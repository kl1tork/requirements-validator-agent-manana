# Render.com: New → Blueprint → выберите этот репозиторий. Ключ и пароль Render спросит при создании.
services:
  - type: web
    name: manana
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m reqval.web
    healthCheckPath: /manifest.webmanifest
    envVars:
      - key: MANANA_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: MANANA_PASSWORD
        sync: false
